name: Feature request
description: Suggest a focused improvement to DealRift.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Relevant stores or data sources
      description: Include official API or terms links when proposing a new source.
